<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couple Journal & Quota Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f3f4f6;
        }
        .tab-btn.active {
            border-bottom: 2px solid #ec4899;
            color: #ec4899;
            font-weight: 600;
        }
        /* Custom scrollbar for horizontal containers */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-rose-100">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid font-bold text-rose-500 text-xl fa-heart"></i>
                <h1 class="font-bold text-lg text-slate-800">Couple Journal</h1>
            </div>
            <div id="connectionStatus" class="flex items-center space-x-1 text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-700">
                <i class="fa-solid fa-circle-notch fa-spin text-[10px]"></i>
                <span>กำลังเชื่อมต่อ...</span>
            </div>
        </div>
        
        <!-- Navigation Tabs -->
        <div class="max-w-md mx-auto flex border-t border-slate-100 text-sm font-medium text-slate-500 bg-white">
            <button onclick="switchTab('daily')" id="tab-daily" class="tab-btn active flex-1 py-3 text-center transition-colors">
                <i class="fa-solid fa-calendar-check mr-1"></i> Daily
            </button>
            <button onclick="switchTab('quota')" id="tab-quota" class="tab-btn flex-1 py-3 text-center transition-colors">
                <i class="fa-solid fa-chart-pie mr-1"></i> Quota
            </button>
            <button onclick="switchTab('summary')" id="tab-summary" class="tab-btn flex-1 py-3 text-center transition-colors">
                <i class="fa-solid fa-trophy mr-1"></i> สรุปผล
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- TAB 1: DAILY CHECKLIST -->
        <section id="sec-daily" class="space-y-4">
            <!-- Date Picker Card -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-0.5">เลือกวันที่</label>
                    <input type="date" id="dailyDatePicker" onchange="onDailyDateChange()" class="font-semibold text-slate-700 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-sm focus:outline-none focus:border-rose-400">
                </div>
                <button onclick="setDailyToToday()" class="text-xs bg-rose-50 text-rose-600 px-3 py-1.5 rounded-lg font-medium hover:bg-rose-100 transition-colors">
                    วันนี้
                </button>
            </div>

            <!-- Profile Overview Header -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
                    <div id="userAAvatarDaily" class="w-10 h-10 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center font-bold text-lg overflow-hidden shrink-0"></div>
                    <div class="overflow-hidden">
                        <div id="userANameDaily" class="font-bold text-sm text-slate-800 truncate">User A</div>
                        <div class="text-[11px] text-slate-400">เช็คลิสต์ประจำวัน</div>
                    </div>
                </div>
                <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
                    <div id="userBAvatarDaily" class="w-10 h-10 rounded-full bg-blue-100 text-blue-500 flex items-center justify-center font-bold text-lg overflow-hidden shrink-0"></div>
                    <div class="overflow-hidden">
                        <div id="userBNameDaily" class="font-bold text-sm text-slate-800 truncate">User B</div>
                        <div class="text-[11px] text-slate-400">เช็คลิสต์ประจำวัน</div>
                    </div>
                </div>
            </div>

            <!-- Checklist Items Grid -->
            <div id="dailyChecklistContainer" class="space-y-3">
                <!-- JS Inject Content -->
            </div>
        </section>

        <!-- TAB 2: QUOTA TRACKER -->
        <section id="sec-quota" class="space-y-4 hidden">
            <!-- Month Picker Card -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-0.5">เลือกเดือน</label>
                    <input type="month" id="quotaMonthPicker" onchange="onQuotaMonthChange()" class="font-semibold text-slate-700 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-sm focus:outline-none focus:border-rose-400">
                </div>
                <button onclick="setQuotaToCurrentMonth()" class="text-xs bg-rose-50 text-rose-600 px-3 py-1.5 rounded-lg font-medium hover:bg-rose-100 transition-colors">
                    เดือนปัจจุบัน
                </button>
            </div>

            <!-- Quotas Container -->
            <div id="quotaContainer" class="space-y-3">
                <!-- JS Inject Content -->
            </div>
        </section>

        <!-- TAB 3: SUMMARY -->
        <section id="sec-summary" class="space-y-4 hidden">
            <!-- Selected Month Banner -->
            <div class="bg-gradient-to-r from-rose-500 to-pink-500 rounded-2xl p-4 text-white shadow-md">
                <div class="text-xs opacity-80">สรุปภาพรวมประจำเดือน</div>
                <div id="summaryMonthLabel" class="text-lg font-bold">กำลังโหลด...</div>
            </div>

            <!-- User Comparisons -->
            <div class="grid grid-cols-2 gap-3">
                <!-- User A Summary Card -->
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center relative overflow-hidden">
                    <div class="w-16 h-16 mx-auto rounded-full bg-rose-50 border-2 border-rose-200 flex items-center justify-center overflow-hidden mb-2 shadow-inner">
                        <div id="userASummaryAvatar" class="w-full h-full flex items-center justify-center font-bold text-2xl text-rose-500"></div>
                    </div>
                    <h3 id="userASummaryName" class="font-bold text-slate-800 text-base mb-3 truncate">User A</h3>
                    
                    <div class="space-y-2 text-left bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-500">Daily Checklist:</span>
                            <span id="userADailyScore" class="font-bold text-rose-600 text-sm">0</span>
                        </div>
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-500">Quota ที่ใช้ไป:</span>
                            <span id="userAQuotaUsed" class="font-bold text-rose-600 text-sm">0</span>
                        </div>
                    </div>
                </div>

                <!-- User B Summary Card -->
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center relative overflow-hidden">
                    <div class="w-16 h-16 mx-auto rounded-full bg-blue-50 border-2 border-blue-200 flex items-center justify-center overflow-hidden mb-2 shadow-inner">
                        <div id="userBSummaryAvatar" class="w-full h-full flex items-center justify-center font-bold text-2xl text-blue-500"></div>
                    </div>
                    <h3 id="userBSummaryName" class="font-bold text-slate-800 text-base mb-3 truncate">User B</h3>
                    
                    <div class="space-y-2 text-left bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-500">Daily Checklist:</span>
                            <span id="userBDailyScore" class="font-bold text-blue-600 text-sm">0</span>
                        </div>
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-500">Quota ที่ใช้ไป:</span>
                            <span id="userBQuotaUsed" class="font-bold text-blue-600 text-sm">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- JS Logic -->
    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            databaseURL: "https://daily-and-quota-tracker-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- 2. DEFAULT STATE & DATA DEFINITIONS ---
        const DEFAULT_STATE = {
            profiles: {
                userA: { name: "User A", avatar: "A" },
                userB: { name: "User B", avatar: "B" }
            },
            dailyTasks: [
                { id: "task_1", name: "ออกกำลังกาย 30 นาที", icon: "fa-dumbbell" },
                { id: "task_2", name: "ดื่มน้ำ 2 ลิตร", icon: "fa-glass-water" },
                { id: "task_3", name: "อ่านหนังสือ 15 หน้า", icon: "fa-book-open" },
                { id: "task_4", name: "เข้านอนก่อน 5 ทุ่ม", icon: "fa-bed" }
            ],
            quotaTasks: [
                { id: "q_1", name: "กินของหวาน / ชานม", max: 10, unit: "ครั้ง" },
                { id: "q_2", name: "ซื้อของตามใจชอบ", max: 5, unit: "ครั้ง" },
                { id: "q_3", name: "เล่นเกมเกิน 2 ชม.", max: 8, unit: "ครั้ง" }
            ]
        };

        let state = {
            profiles: DEFAULT_STATE.profiles,
            dailyTasks: DEFAULT_STATE.dailyTasks,
            quotaTasks: DEFAULT_STATE.quotaTasks,
            dailyLogs: {},
            quotaLogs: {}
        };

        // UI State Variables
        let currentTab = 'daily';
        let selectedDailyDate = new Date().toISOString().substring(0, 10);
        let selectedQuotaMonth = new Date().toISOString().substring(0, 7);

        // --- 3. INITIALIZATION ---
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('dailyDatePicker').value = selectedDailyDate;
            document.getElementById('quotaMonthPicker').value = selectedQuotaMonth;
            
            initFirebaseListeners();
        });

        function initFirebaseListeners() {
            const statusEl = document.getElementById('connectionStatus');
            
            // Listen to connected state
            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === true) {
                    statusEl.className = "flex items-center space-x-1 text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700";
                    statusEl.innerHTML = `<i class="fa-solid fa-circle text-[8px]"></i> <span>เชื่อมต่อแล้ว</span>`;
                } else {
                    statusEl.className = "flex items-center space-x-1 text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-700";
                    statusEl.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-[10px]"></i> <span>กำลังเชื่อมต่อ...</span>`;
                }
            });

            // Listen to main Database
            db.ref().on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    state.profiles = data.profiles || DEFAULT_STATE.profiles;
                    state.dailyTasks = data.dailyTasks || DEFAULT_STATE.dailyTasks;
                    state.quotaTasks = data.quotaTasks || DEFAULT_STATE.quotaTasks;
                    state.dailyLogs = data.dailyLogs || {};
                    state.quotaLogs = data.quotaLogs || {};
                } else {
                    // Seed initial data if DB is completely empty
                    db.ref().set(DEFAULT_STATE);
                }
                renderApp();
            });
        }

        // --- 4. RENDER ROUTINER ---
        function renderApp() {
            renderDailyProfiles();
            renderDailyChecklist();
            renderQuotaTracker();
            updateSummaryData();
        }

        function renderAvatar(avatarVal) {
            if (!avatarVal) return '';
            if (avatarVal.startsWith('http://') || avatarVal.startsWith('https://') || avatarVal.startsWith('data:image')) {
                return `<img src="${avatarVal}" class="w-full h-full object-cover" alt="Avatar" />`;
            }
            return avatarVal.charAt(0).toUpperCase();
        }

        // --- 5. DAILY CHECKLIST TAB LOGIC ---
        function renderDailyProfiles() {
            const userA = state.profiles?.userA || DEFAULT_STATE.profiles.userA;
            const userB = state.profiles?.userB || DEFAULT_STATE.profiles.userB;

            document.getElementById('userANameDaily').innerText = userA.name;
            document.getElementById('userAAvatarDaily').innerHTML = renderAvatar(userA.avatar);
            
            document.getElementById('userBNameDaily').innerText = userB.name;
            document.getElementById('userBAvatarDaily').innerHTML = renderAvatar(userB.avatar);
        }

        function renderDailyChecklist() {
            const container = document.getElementById('dailyChecklistContainer');
            container.innerHTML = '';

            const dateLog = state.dailyLogs?.[selectedDailyDate] || {};
            const userALog = dateLog.userA || {};
            const userBLog = dateLog.userB || {};

            state.dailyTasks.forEach(task => {
                const isCheckedA = !!userALog[task.id];
                const isCheckedB = !!userBLog[task.id];

                const card = document.createElement('div');
                card.className = "bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between";
                
                card.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden mr-2">
                        <div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center shrink-0">
                            <i class="fa-solid ${task.icon || 'fa-check'} text-base"></i>
                        </div>
                        <span class="font-medium text-slate-700 text-sm truncate">${task.name}</span>
                    </div>
                    <div class="flex items-center space-x-3 shrink-0">
                        <!-- Checkbox User A -->
                        <button onclick="toggleDailyTask('userA', '${task.id}')" 
                                class="w-9 h-9 rounded-xl flex items-center justify-center transition-all ${isCheckedA ? 'bg-rose-500 text-white shadow-md shadow-rose-200' : 'bg-slate-100 text-slate-300 hover:bg-slate-200'}">
                            <i class="fa-solid fa-check text-sm"></i>
                        </button>
                        <!-- Checkbox User B -->
                        <button onclick="toggleDailyTask('userB', '${task.id}')" 
                                class="w-9 h-9 rounded-xl flex items-center justify-center transition-all ${isCheckedB ? 'bg-blue-500 text-white shadow-md shadow-blue-200' : 'bg-slate-100 text-slate-300 hover:bg-slate-200'}">
                            <i class="fa-solid fa-check text-sm"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleDailyTask(userKey, taskId) {
            const currentVal = !!state.dailyLogs?.[selectedDailyDate]?.[userKey]?.[taskId];
            db.ref(`dailyLogs/${selectedDailyDate}/${userKey}/${taskId}`).set(!currentVal);
        }

        function onDailyDateChange() {
            selectedDailyDate = document.getElementById('dailyDatePicker').value;
            if (selectedDailyDate) {
                // อัปเดตเดือนของ Quota ให้ตรงกันหากผู้ใช้ข้ามเดือน
                const month = selectedDailyDate.substring(0, 7);
                if (month !== selectedQuotaMonth) {
                    selectedQuotaMonth = month;
                    document.getElementById('quotaMonthPicker').value = selectedQuotaMonth;
                }
                renderApp();
            }
        }

        function setDailyToToday() {
            selectedDailyDate = new Date().toISOString().substring(0, 10);
            document.getElementById('dailyDatePicker').value = selectedDailyDate;
            onDailyDateChange();
        }

        // --- 6. QUOTA TRACKER TAB LOGIC ---
        function renderQuotaTracker() {
            const container = document.getElementById('quotaContainer');
            container.innerHTML = '';

            const userA = state.profiles?.userA || DEFAULT_STATE.profiles.userA;
            const userB = state.profiles?.userB || DEFAULT_STATE.profiles.userB;

            const monthLog = state.quotaLogs?.[selectedQuotaMonth] || {};
            const userALog = monthLog.userA || {};
            const userBLog = monthLog.userB || {};

            state.quotaTasks.forEach(task => {
                const countA = userALog[task.id] || 0;
                const countB = userBLog[task.id] || 0;

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3";

                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                        <span class="font-bold text-slate-800 text-sm">${task.name}</span>
                        <span class="text-xs text-slate-400">โควตา: <strong class="text-slate-600">${task.max}</strong> ${task.unit}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <!-- User A Control -->
                        <div class="bg-rose-50/50 p-2.5 rounded-xl border border-rose-100/60">
                            <div class="text-xs font-semibold text-rose-500 mb-1.5 truncate">${userA.name}</div>
                            <div class="flex items-center justify-between">
                                <button onclick="changeQuota('userA', '${task.id}', -1)" class="w-7 h-7 rounded-lg bg-white border border-rose-200 text-rose-600 flex items-center justify-center font-bold hover:bg-rose-100">-</button>
                                <span class="font-bold text-slate-700 text-sm">${countA} / ${task.max}</span>
                                <button onclick="changeQuota('userA', '${task.id}', 1)" class="w-7 h-7 rounded-lg bg-rose-500 text-white flex items-center justify-center font-bold shadow-sm shadow-rose-200 hover:bg-rose-600">+</button>
                            </div>
                        </div>

                        <!-- User B Control -->
                        <div class="bg-blue-50/50 p-2.5 rounded-xl border border-blue-100/60">
                            <div class="text-xs font-semibold text-blue-500 mb-1.5 truncate">${userB.name}</div>
                            <div class="flex items-center justify-between">
                                <button onclick="changeQuota('userB', '${task.id}', -1)" class="w-7 h-7 rounded-lg bg-white border border-blue-200 text-blue-600 flex items-center justify-center font-bold hover:bg-blue-100">-</button>
                                <span class="font-bold text-slate-700 text-sm">${countB} / ${task.max}</span>
                                <button onclick="changeQuota('userB', '${task.id}', 1)" class="w-7 h-7 rounded-lg bg-blue-500 text-white flex items-center justify-center font-bold shadow-sm shadow-blue-200 hover:bg-blue-600">+</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function changeQuota(userKey, taskId, delta) {
            const currentVal = state.quotaLogs?.[selectedQuotaMonth]?.[userKey]?.[taskId] || 0;
            const newVal = Math.max(0, currentVal + delta);
            db.ref(`quotaLogs/${selectedQuotaMonth}/${userKey}/${taskId}`).set(newVal);
        }

        function onQuotaMonthChange() {
            selectedQuotaMonth = document.getElementById('quotaMonthPicker').value;
            renderApp();
        }

        function setQuotaToCurrentMonth() {
            selectedQuotaMonth = new Date().toISOString().substring(0, 7);
            document.getElementById('quotaMonthPicker').value = selectedQuotaMonth;
            onQuotaMonthChange();
        }

        // --- 7. SUMMARY TAB LOGIC (คำนวณแยกตามเดือนที่เลือกได้สมบูรณ์) ---
        function updateSummaryData() {
            const userA = state.profiles?.userA || DEFAULT_STATE.profiles.userA;
            const userB = state.profiles?.userB || DEFAULT_STATE.profiles.userB;

            // Render Header Names & Avatars
            document.getElementById('userASummaryName').innerText = userA.name;
            document.getElementById('userASummaryAvatar').innerHTML = renderAvatar(userA.avatar);
            document.getElementById('userBSummaryName').innerText = userB.name;
            document.getElementById('userBSummaryAvatar').innerHTML = renderAvatar(userB.avatar);

            // Month Label Formatting
            const [year, month] = selectedQuotaMonth.split('-');
            const dateObj = new Date(year, month - 1);
            const monthName = dateObj.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
            document.getElementById('summaryMonthLabel').innerText = monthName;

            // 1. คำนวณ Daily Checklist เฉพาะเดือนที่เลือก
            let userADailyCount = 0;
            let userBDailyCount = 0;

            if (state.dailyLogs) {
                Object.keys(state.dailyLogs).forEach(dateStr => {
                    // กรองเฉพาะวันที่อยู่ในเดือนที่เลือก (YYYY-MM)
                    if (dateStr.startsWith(selectedQuotaMonth)) {
                        const dayLog = state.dailyLogs[dateStr];
                        if (dayLog.userA && Object.values(dayLog.userA).some(v => v === true)) userADailyCount++;
                        if (dayLog.userB && Object.values(dayLog.userB).some(v => v === true)) userBDailyCount++;
                    }
                });
            }

            document.getElementById('userADailyScore').innerText = userADailyCount;
            document.getElementById('userBDailyScore').innerText = userBDailyCount;

            // 2. คำนวณ Quota รวมเฉพาะเดือนที่เลือก
            let userAQuotaSum = 0;
            let userBQuotaSum = 0;

            if (state.quotaLogs && state.quotaLogs[selectedQuotaMonth]) {
                const monthQuota = state.quotaLogs[selectedQuotaMonth];
                if (monthQuota.userA) {
                    Object.values(monthQuota.userA).forEach(val => {
                        if (typeof val === 'number') userAQuotaSum += val;
                    });
                }
                if (monthQuota.userB) {
                    Object.values(monthQuota.userB).forEach(val => {
                        if (typeof val === 'number') userBQuotaSum += val;
                    });
                }
            }

            document.getElementById('userAQuotaUsed').innerText = userAQuotaSum;
            document.getElementById('userBQuotaUsed').innerText = userBQuotaSum;
        }

        // --- 8. TAB NAVIGATION ---
        function switchTab(tab) {
            currentTab = tab;
            
            // Toggle Buttons Style
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');

            // Toggle Sections
            document.getElementById('sec-daily').classList.add('hidden');
            document.getElementById('sec-quota').classList.add('hidden');
            document.getElementById('sec-summary').classList.add('hidden');

            document.getElementById(`sec-${tab}`).classList.remove('hidden');

            // Render/Update data on switch
            if (tab === 'summary') {
                updateSummaryData();
            }
        }
    </script>
</body>
</html>
