<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมุดบันทึกพี่เซ้น น้องแก้ม</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #f3f4f6;
        }
        .tab-btn.active { 
            border-bottom: 3px solid #ec4899; 
            color: #ec4899; 
            font-weight: 700; 
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl rounded-3xl overflow-hidden my-0 sm:my-4">
        
        <!-- HEADER SECTION (ดีไซน์เดิมตามภาพ) -->
        <div class="bg-gradient-to-r from-rose-400 via-pink-500 to-purple-600 p-5 text-white rounded-b-3xl shadow-md space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <!-- รูปโปรไฟล์คู่แบบวงกลม -->
                    <div id="headerCombinedAvatar" class="w-12 h-12 rounded-full border-2 border-white/80 overflow-hidden bg-white/20 flex items-center justify-center font-bold text-lg shadow-sm shrink-0">
                        ❤️
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight text-white">สมุดบันทึกพี่เซ้น น้องแก้ม</h1>
                        <div id="connectionStatus" class="flex items-center space-x-1.5 text-xs text-emerald-200 mt-0.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                            <span>Online</span>
                        </div>
                    </div>
                </div>
                <!-- ปุ่มตั้งค่า -->
                <button class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center backdrop-blur-sm transition-all text-white">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
            </div>

            <!-- TOGGLE SWITCHER สลับผู้ใช้ (พี่เซ้น / น้องแก้ม) -->
            <div class="grid grid-cols-2 gap-2 bg-black/15 p-1 rounded-2xl backdrop-blur-md">
                <button onclick="selectActiveUser('userA')" id="userBtn-userA" class="py-2 px-3 rounded-xl font-bold text-sm flex items-center justify-center space-x-2 transition-all bg-white text-slate-800 shadow-md">
                    <span>🥳</span>
                    <span id="labelUserA">พี่เซ้น</span>
                </button>
                <button onclick="selectActiveUser('userB')" id="userBtn-userB" class="py-2 px-3 rounded-xl font-bold text-sm flex items-center justify-center space-x-2 transition-all text-white/90 hover:bg-white/10">
                    <span>🥳</span>
                    <span id="labelUserB">น้องแก้ม</span>
                </button>
            </div>
        </div>

        <!-- TAB NAVIGATION BAR -->
        <div class="flex border-b border-slate-100 text-sm font-semibold text-slate-400 bg-white sticky top-0 z-10">
            <button onclick="switchTab('daily')" id="tab-daily" class="tab-btn active flex-1 py-3 text-center transition-all flex items-center justify-center space-x-1.5">
                <i class="fa-regular fa-calendar-check"></i>
                <span>Daily Check</span>
            </button>
            <button onclick="switchTab('quota')" id="tab-quota" class="tab-btn flex-1 py-3 text-center transition-all flex items-center justify-center space-x-1.5">
                <i class="fa-solid fa-cookie-bite"></i>
                <span>Quota Tracker</span>
            </button>
            <button onclick="switchTab('summary')" id="tab-summary" class="tab-btn flex-1 py-3 text-center transition-all flex items-center justify-center space-x-1.5">
                <i class="fa-solid fa-trophy"></i>
                <span>สรุปผล</span>
            </button>
        </div>

        <!-- MAIN CONTENT AREA -->
        <main class="p-4 space-y-4">

            <!-- TAB 1: DAILY CHECK -->
            <section id="sec-daily" class="space-y-4">
                <!-- Date Bar & Streak Badge -->
                <div class="bg-rose-50/60 p-3.5 rounded-2xl border border-rose-100/80 flex items-center justify-between shadow-sm">
                    <div class="flex items-center space-x-2 text-rose-500">
                        <i class="fa-regular fa-calendar text-base"></i>
                        <input type="date" id="dailyDatePicker" onchange="onDailyDateChange()" class="font-bold text-slate-700 bg-transparent focus:outline-none text-sm">
                    </div>
                    <div class="bg-white px-3 py-1 rounded-full border border-rose-100 shadow-sm text-xs font-bold text-rose-500 flex items-center space-x-1">
                        <span>🔥</span>
                        <span id="streakCount">0 วันติด</span>
                    </div>
                </div>

                <!-- Daily Checklist Container -->
                <div id="dailyChecklistContainer" class="space-y-3"></div>

                <!-- Add Checklist Button -->
                <button onclick="addCustomDailyTask()" class="w-full py-3 border-2 border-dashed border-rose-200 rounded-2xl text-rose-500 font-bold text-sm hover:bg-rose-50/50 transition-all flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>เพิ่มหัวข้อเช็คลิสต์ประจำวัน</span>
                </button>

                <!-- Memo Section -->
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-2">
                    <div class="flex items-center space-x-2 text-slate-700 font-bold text-sm">
                        <i class="fa-regular fa-pen-to-square text-indigo-500"></i>
                        <span>บันทึกประจำวัน (Memo)</span>
                    </div>
                    <textarea id="dailyMemo" oninput="saveMemo()" placeholder="วันนี้เป็นยังไงบ้าง..." class="w-full h-24 p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:border-rose-400 resize-none text-slate-700"></textarea>
                </div>
            </section>

            <!-- TAB 2: QUOTA TRACKER -->
            <section id="sec-quota" class="space-y-4 hidden">
                <!-- Month Picker Header -->
                <div class="bg-rose-50/60 p-3.5 rounded-2xl border border-rose-100/80 flex items-center justify-between shadow-sm">
                    <div class="flex items-center space-x-2">
                        <i class="fa-regular fa-calendar-days text-rose-500"></i>
                        <div>
                            <label class="block text-[10px] font-semibold text-slate-400 leading-none">เลือกเดือน</label>
                            <input type="month" id="quotaMonthPicker" onchange="onQuotaMonthChange()" class="font-bold text-slate-700 bg-transparent focus:outline-none text-sm">
                        </div>
                    </div>
                    <button onclick="setQuotaToCurrentMonth()" class="text-xs bg-white text-rose-600 px-3 py-1.5 rounded-xl font-bold border border-rose-100 shadow-sm hover:bg-rose-50">
                        เดือนปัจจุบัน
                    </button>
                </div>

                <!-- Quotas Items Container -->
                <div id="quotaContainer" class="space-y-3"></div>
            </section>

            <!-- TAB 3: SUMMARY -->
            <section id="sec-summary" class="space-y-4 hidden">
                <div class="bg-gradient-to-r from-rose-500 to-purple-600 rounded-2xl p-4 text-white shadow-md">
                    <div class="text-xs opacity-80">สรุปภาพรวมประจำเดือน</div>
                    <div id="summaryMonthLabel" class="text-lg font-bold">กำลังโหลด...</div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <!-- User A Card -->
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
                        <div id="userASummaryAvatar" class="w-14 h-14 mx-auto rounded-full bg-rose-100 text-rose-500 font-bold text-xl flex items-center justify-center overflow-hidden mb-2 border border-rose-200"></div>
                        <h3 id="userASummaryName" class="font-bold text-slate-800 text-sm mb-3">พี่เซ้น</h3>
                        <div class="space-y-2 text-left bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs">
                            <div class="flex justify-between">
                                <span class="text-slate-500">Daily Check:</span>
                                <strong id="userADailyScore" class="text-rose-600">0</strong>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-500">Quota ที่ใช้ไป:</span>
                                <strong id="userAQuotaUsed" class="text-rose-600">0</strong>
                            </div>
                        </div>
                    </div>

                    <!-- User B Card -->
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
                        <div id="userBSummaryAvatar" class="w-14 h-14 mx-auto rounded-full bg-purple-100 text-purple-500 font-bold text-xl flex items-center justify-center overflow-hidden mb-2 border border-purple-200"></div>
                        <h3 id="userBSummaryName" class="font-bold text-slate-800 text-sm mb-3">น้องแก้ม</h3>
                        <div class="space-y-2 text-left bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs">
                            <div class="flex justify-between">
                                <span class="text-slate-500">Daily Check:</span>
                                <strong id="userBDailyScore" class="text-purple-600">0</strong>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-500">Quota ที่ใช้ไป:</span>
                                <strong id="userBQuotaUsed" class="text-purple-600">0</strong>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // 1. FIREBASE INITIALIZATION
        const firebaseConfig = {
            databaseURL: "https://daily-and-quota-tracker-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. DEFAULT STATE STRUCTURE
        const DEFAULT_STATE = {
            profiles: {
                userA: { name: "พี่เซ้น", avatar: "https://i.ibb.co/gMxGsqnB/IMG-0082.jpg" },
                userB: { name: "น้องแก้ม", avatar: "https://i.ibb.co/gMxGsqnB/IMG-0082.jpg" }
            },
            dailyTasks: [
                { id: "task_1", name: "อาบน้ำก่อน 19:30 น.", icon: "🚿" },
                { id: "task_2", name: "เข้านอนก่อน 23:00 น.", icon: "🛏️" },
                { id: "task_3", name: "ดื่มน้ำครบ 2 ลิตร", icon: "💧" }
            ],
            quotaTasks: [
                { id: "q_1", name: "กินขนม/น้ำหวาน", max: 10, unit: "ครั้ง" },
                { id: "q_2", name: "สั่งอาหารนอกบ้าน", max: 8, unit: "ครั้ง" }
            ]
        };

        let state = { ...DEFAULT_STATE, dailyLogs: {}, quotaLogs: {}, memos: {} };
        let activeUser = 'userA';
        let selectedDailyDate = new Date().toISOString().substring(0, 10);
        let selectedQuotaMonth = new Date().toISOString().substring(0, 7);

        // 3. STARTUP
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('dailyDatePicker').value = selectedDailyDate;
            document.getElementById('quotaMonthPicker').value = selectedQuotaMonth;
            initFirebase();
        });

        function initFirebase() {
            db.ref().on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    state.profiles = data.profiles || DEFAULT_STATE.profiles;
                    state.dailyTasks = data.dailyTasks || DEFAULT_STATE.dailyTasks;
                    state.quotaTasks = data.quotaTasks || DEFAULT_STATE.quotaTasks;
                    state.dailyLogs = data.dailyLogs || {};
                    state.quotaLogs = data.quotaLogs || {};
                    state.memos = data.memos || {};
                } else {
                    db.ref().set(DEFAULT_STATE);
                }
                renderApp();
            });
        }

        function renderApp() {
            updateHeaderUI();
            renderDailyChecklist();
            renderQuotaTracker();
            updateSummaryData();
            loadMemo();
        }

        function renderAvatar(avatarVal) {
            if (avatarVal && (avatarVal.startsWith('http') || avatarVal.startsWith('data:image'))) {
                return `<img src="${avatarVal}" class="w-full h-full object-cover rounded-full" />`;
            }
            return avatarVal || '👤';
        }

        function selectActiveUser(userKey) {
            activeUser = userKey;
            document.getElementById('userBtn-userA').className = `py-2 px-3 rounded-xl font-bold text-sm flex items-center justify-center space-x-2 transition-all ${userKey === 'userA' ? 'bg-white text-slate-800 shadow-md' : 'text-white/90 hover:bg-white/10'}`;
            document.getElementById('userBtn-userB').className = `py-2 px-3 rounded-xl font-bold text-sm flex items-center justify-center space-x-2 transition-all ${userKey === 'userB' ? 'bg-white text-slate-800 shadow-md' : 'text-white/90 hover:bg-white/10'}`;
            renderDailyChecklist();
            loadMemo();
        }

        function updateHeaderUI() {
            const userA = state.profiles?.userA || DEFAULT_STATE.profiles.userA;
            const userB = state.profiles?.userB || DEFAULT_STATE.profiles.userB;
            document.getElementById('labelUserA').innerText = userA.name;
            document.getElementById('labelUserB').innerText = userB.name;
            document.getElementById('headerCombinedAvatar').innerHTML = renderAvatar(state.profiles?.[activeUser]?.avatar);
        }

        // 4. DAILY CHECKLIST LOGIC
        function renderDailyChecklist() {
            const container = document.getElementById('dailyChecklistContainer');
            container.innerHTML = '';
            const userLog = state.dailyLogs?.[selectedDailyDate]?.[activeUser] || {};

            state.dailyTasks.forEach(task => {
                const isChecked = !!userLog[task.id];
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-xl">${task.icon || '📌'}</span>
                        <span class="font-bold text-slate-700 text-sm">${task.name}</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleDailyTask('${task.id}')" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-rose-500"></div>
                    </label>
                `;
                container.appendChild(card);
            });
        }

        function toggleDailyTask(taskId) {
            const currentVal = !!state.dailyLogs?.[selectedDailyDate]?.[activeUser]?.[taskId];
            const newVal = !currentVal;

            if (!state.dailyLogs) state.dailyLogs = {};
            if (!state.dailyLogs[selectedDailyDate]) state.dailyLogs[selectedDailyDate] = {};
            if (!state.dailyLogs[selectedDailyDate][activeUser]) state.dailyLogs[selectedDailyDate][activeUser] = {};

            state.dailyLogs[selectedDailyDate][activeUser][taskId] = newVal;
            renderDailyChecklist();
            updateSummaryData();

            db.ref(`dailyLogs/${selectedDailyDate}/${activeUser}/${taskId}`).set(newVal);
        }

        function addCustomDailyTask() {
            const taskName = prompt("ใส่ชื่อหัวข้อเช็คลิสต์ใหม่:");
            if (!taskName) return;
            const newTaskId = 'task_' + Date.now();
            const newTask = { id: newTaskId, name: taskName, icon: '✨' };
            state.dailyTasks.push(newTask);
            db.ref('dailyTasks').set(state.dailyTasks);
        }

        function saveMemo() {
            const text = document.getElementById('dailyMemo').value;
            db.ref(`memos/${selectedDailyDate}/${activeUser}`).set(text);
        }

        function loadMemo() {
            const memoText = state.memos?.[selectedDailyDate]?.[activeUser] || '';
            document.getElementById('dailyMemo').value = memoText;
        }

        // 5. QUOTA TRACKER LOGIC (รองรับเลือกทุกเดือนเรียลไทม์)
        function renderQuotaTracker() {
            const container = document.getElementById('quotaContainer');
            container.innerHTML = '';
            
            // ดึงข้อมูลโควตาตามเดือนที่เลือกในปัจจุบัน
            const monthLog = state.quotaLogs?.[selectedQuotaMonth] || {};

            state.quotaTasks.forEach(task => {
                const countA = monthLog.userA?.[task.id] || 0;
                const countB = monthLog.userB?.[task.id] || 0;

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3";
                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                        <span class="font-bold text-slate-800 text-sm">${task.name}</span>
                        <span class="text-xs text-slate-400">โควตา: <strong class="text-slate-600">${task.max}</strong> ${task.unit}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <!-- User A Box -->
                        <div class="bg-rose-50/50 p-2.5 rounded-xl border border-rose-100/60">
                            <div class="text-xs font-bold text-rose-500 mb-1.5 truncate">${state.profiles?.userA?.name || 'พี่เซ้น'}</div>
                            <div class="flex items-center justify-between">
                                <button onclick="changeQuota('userA', '${task.id}', -1)" class="w-7 h-7 rounded-lg bg-white border border-rose-200 text-rose-600 font-bold hover:bg-rose-100 flex items-center justify-center">-</button>
                                <span class="font-bold text-slate-700 text-sm">${countA} / ${task.max}</span>
                                <button onclick="changeQuota('userA', '${task.id}', 1)" class="w-7 h-7 rounded-lg bg-rose-500 text-white font-bold shadow-sm shadow-rose-200 hover:bg-rose-600 flex items-center justify-center">+</button>
                            </div>
                        </div>
                        
                        <!-- User B Box -->
                        <div class="bg-purple-50/50 p-2.5 rounded-xl border border-purple-100/60">
                            <div class="text-xs font-bold text-purple-500 mb-1.5 truncate">${state.profiles?.userB?.name || 'น้องแก้ม'}</div>
                            <div class="flex items-center justify-between">
                                <button onclick="changeQuota('userB', '${task.id}', -1)" class="w-7 h-7 rounded-lg bg-white border border-purple-200 text-purple-600 font-bold hover:bg-purple-100 flex items-center justify-center">-</button>
                                <span class="font-bold text-slate-700 text-sm">${countB} / ${task.max}</span>
                                <button onclick="changeQuota('userB', '${task.id}', 1)" class="w-7 h-7 rounded-lg bg-purple-500 text-white font-bold shadow-sm shadow-purple-200 hover:bg-purple-600 flex items-center justify-center">+</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ฟังก์ชันเปลี่ยนค่าโควตาแล้วบันทึกลง Firebase Realtime
        function changeQuota(userKey, taskId, delta) {
            if (!state.quotaLogs) state.quotaLogs = {};
            if (!state.quotaLogs[selectedQuotaMonth]) state.quotaLogs[selectedQuotaMonth] = {};
            if (!state.quotaLogs[selectedQuotaMonth][userKey]) state.quotaLogs[selectedQuotaMonth][userKey] = {};

            const currentVal = state.quotaLogs[selectedQuotaMonth][userKey][taskId] || 0;
            const newVal = Math.max(0, currentVal + delta);

            // 1. อัปเดตในเครื่องทันที
            state.quotaLogs[selectedQuotaMonth][userKey][taskId] = newVal;
            renderQuotaTracker();
            updateSummaryData();

            // 2. ส่งขึ้น Firebase
            db.ref(`quotaLogs/${selectedQuotaMonth}/${userKey}/${taskId}`).set(newVal)
              .catch(err => console.error("Firebase update failed:", err));
        }

        function onDailyDateChange() {
            selectedDailyDate = document.getElementById('dailyDatePicker').value;
            const m = selectedDailyDate.substring(0, 7);
            if (m !== selectedQuotaMonth) {
                selectedQuotaMonth = m;
                document.getElementById('quotaMonthPicker').value = selectedQuotaMonth;
            }
            renderApp();
        }

        function onQuotaMonthChange() {
            selectedQuotaMonth = document.getElementById('quotaMonthPicker').value;
            renderApp();
        }

        function setQuotaToCurrentMonth() {
            selectedQuotaMonth = new Date().toISOString().substring(0, 7);
            document.getElementById('quotaMonthPicker').value = selectedQuotaMonth;
            onQuotaMonthChange();
        }

        // 6. SUMMARY LOGIC
        function updateSummaryData() {
            const userA = state.profiles?.userA || DEFAULT_STATE.profiles.userA;
            const userB = state.profiles?.userB || DEFAULT_STATE.profiles.userB;

            document.getElementById('userASummaryName').innerText = userA.name;
            document.getElementById('userASummaryAvatar').innerHTML = renderAvatar(userA.avatar);
            document.getElementById('userBSummaryName').innerText = userB.name;
            document.getElementById('userBSummaryAvatar').innerHTML = renderAvatar(userB.avatar);

            const [year, month] = selectedQuotaMonth.split('-');
            if (year && month) {
                const dateObj = new Date(parseInt(year), parseInt(month) - 1);
                document.getElementById('summaryMonthLabel').innerText = dateObj.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
            }

            // คำนวณคะแนน Daily
            let countA = 0, countB = 0;
            if (state.dailyLogs) {
                Object.keys(state.dailyLogs).forEach(d => {
                    if (d.startsWith(selectedQuotaMonth)) {
                        if (state.dailyLogs[d]?.userA && Object.values(state.dailyLogs[d].userA).some(v => v === true)) countA++;
                        if (state.dailyLogs[d]?.userB && Object.values(state.dailyLogs[d].userB).some(v => v === true)) countB++;
                    }
                });
            }
            document.getElementById('userADailyScore').innerText = countA;
            document.getElementById('userBDailyScore').innerText = countB;

            // คำนวณ Quota
            let qA = 0, qB = 0;
            const monthQuota = state.quotaLogs?.[selectedQuotaMonth];
            if (monthQuota) {
                if (monthQuota.userA) Object.values(monthQuota.userA).forEach(v => { if (typeof v === 'number') qA += v; });
                if (monthQuota.userB) Object.values(monthQuota.userB).forEach(v => { if (typeof v === 'number') qB += v; });
            }
            document.getElementById('userAQuotaUsed').innerText = qA;
            document.getElementById('userBQuotaUsed').innerText = qB;
        }

        // 7. TAB NAVIGATION
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');

            ['daily', 'quota', 'summary'].forEach(t => document.getElementById(`sec-${t}`).classList.add('hidden'));
            document.getElementById(`sec-${tab}`).classList.remove('hidden');

            if (tab === 'summary') updateSummaryData();
        }
    </script>
</body>
</html>
